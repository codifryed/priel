# priel — a hi-res terminal client for the TIDAL streaming service.
# Unofficial: not affiliated with, endorsed by, or sponsored by TIDAL/Aspiro.
#
#   priel-core    library: TIDAL API + stream resolution (UI-agnostic)
#   priel-player  library: embedded libmpv player (UI-agnostic)
#   priel-tui     binary `priel`: ratatui frontend (mouse + VIM, herdr/ncspot-inspired)
#
# The two libraries carry no UI code, so a GUI frontend (iced/libcosmic) can be
# added later as a second binary sharing them.

[workspace]
resolver = "3"
members = ["priel-core", "priel-player", "priel-tui"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://codeberg.org/codifryed/priel"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
# All three are already in the tree via ureq/rustls, so naming them directly
# costs no new crates: SHA-256 and a CSPRNG for PKCE, and query encoding.
ring = "0.17"
getrandom = "0.4"
percent-encoding = "2.3"
regex = "1"
log = { version = "0.4", features = ["std"] }
# Already in the tree: libmpv2 is a thin wrapper over it and nothing else, so
# naming it directly costs no new crate and no new system library. It is here
# for `mpv_request_log_messages`, which libmpv2 does not wrap. Its default
# features leave bindgen out, so no clang at build time either.
libmpv2-sys = "4"
# ureq: blocking, rustls, no async runtime. No tokio/hyper anywhere in the tree.
# Already in the tree: this is the crate ratatui measures with, so naming it
# directly costs no new crate. Pinned to ratatui's own version, because a
# truncation that measured differently from the renderer would put every hit
# box one cell off what was painted.
unicode-width = "0.2"
# The one genuinely new dependency in the tree, and the only decoder in it: a
# pure-Rust baseline+progressive JPEG decoder for the album cover, drawn as half
# blocks (see `docs/cover-art.md`). No C, no build-time tooling, and off the two
# UI-agnostic libraries entirely - it lives in priel-tui alone, because a future
# GUI frontend wants the JPEG bytes and will decode them itself. `image` was the
# alternative and would have cost eight more crates for resampling this does not
# need at a cover's size. `zune-core` comes with it, for the decoder options.
zune-jpeg = "0.5"
zune-core = "0.5"
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.3"
priel-core = { path = "priel-core" }
# default-features off here so priel-tui's own `libmpv` feature is the single
# switch that pulls libmpv in (default on) or leaves it out (--no-default-features).
priel-player = { path = "priel-player", default-features = false }

[workspace.lints.clippy]
# `priority = -1` so the group sits below the individual overrides that follow.
pedantic = { level = "warn", priority = -1 }

[profile.dev]
debug = "line-tables-only"

[profile.release]
# priel runs for hours, so steady-state CPU beats binary size.
opt-level = 3
lto = "fat"
codegen-units = 1
# Also makes unwinding across the mpv FFI callbacks impossible, which is UB.
panic = "abort"
