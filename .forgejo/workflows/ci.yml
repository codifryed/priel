# Test and lint on every push and pull request.
#
# Each job installs its own Rust toolchain and runs cargo in the *same* shell
# step, sourcing ~/.cargo/env rather than trusting a PATH set in an earlier step
# - Codeberg's default runner image does not ship Rust, and cross-step PATH did
# not carry. Split into parallel jobs so no single one has to fit formatting,
# clippy over both feature configurations and the whole test suite inside the
# runner's time cap; each caches ~/.cargo and target/ so a re-run is quick, and
# the cache is best-effort so a cache backend that is absent cannot fail a job.
#
# Mirrors `make check`, the local gate.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fmt:
    runs-on: codeberg-small
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      - name: Format check
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --component rustfmt
          . "$HOME/.cargo/env"
          cargo fmt --check

  clippy:
    runs-on: codeberg-medium
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      - name: Build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential pkg-config libmpv-dev
      - uses: https://data.forgejo.org/actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: clippy-${{ hashFiles('Cargo.lock') }}
          restore-keys: clippy-
      - name: Clippy, both feature configurations
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --component clippy
          . "$HOME/.cargo/env"
          cargo clippy --all-targets -- -D warnings
          cargo clippy -p priel-tui --no-default-features --all-targets -- -D warnings

  test:
    runs-on: codeberg-medium
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      - name: Build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential pkg-config libmpv-dev
      - uses: https://data.forgejo.org/actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ hashFiles('Cargo.lock') }}
          restore-keys: test-
      - name: Tests, both feature configurations
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal
          . "$HOME/.cargo/env"
          cargo test --locked
          cargo test -p priel-tui --no-default-features --locked
          cargo test -p priel-player --no-default-features --locked
