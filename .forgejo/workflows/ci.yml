# Test and lint on every push and pull request.
#
# Runs in the official Rust image, so cargo and rustc are already there and no
# toolchain is installed per run. rustfmt and clippy are *not* in that image -
# they are separate rustup components - so the fmt and clippy jobs add the one
# they need, which is a quick component download rather than a toolchain. The
# checkout is done by hand with git rather than the `actions/checkout` action,
# because that action is JavaScript and the Rust image ships no Node for it to
# run on - the same reason there is no `actions/cache` step here. Split into
# parallel jobs so formatting, clippy over both feature configurations and the
# test suite run at once rather than one after another.
#
# `runs-on: self-hosted` sends every job to the maintainer's own runner rather
# than Codeberg's shared ones, whose per-job memory (filesystem writes included)
# is too small for a release build. There is no `codeberg-*` fallback on purpose:
# a job waits for a self-hosted runner rather than landing on a constrained one.
#
# The Rust image is pinned to an exact version rather than `rust:1-bookworm`:
# clippy's lint set moves between releases, so a floating image would fail the
# gate on a lint the maintainer's toolchain does not have yet. Bump this in step
# with the local toolchain, fixing any new lints deliberately when you do.
#
# Mirrors `make check`, the local gate.
name: ci

on:
  # Every branch push and every pull request targeting main.
  #
  # Branch pushes are all trusted: pushing here needs write access, so only the
  # maintainer makes branches in this repo. Pull requests are the untrusted
  # surface - a fork's author cannot push here but can still open a PR, and on a
  # self-hosted runner that PR's code (and its dependencies' build scripts) would
  # run on the maintainer's own machine. Forgejo gates that: a new or untrusted
  # author's PR workflow is blocked until a maintainer approves it on the PR page
  # ("Approve once" for the run, "Approve always" to trust the author from then
  # on). Only approve a fork PR after reading its workflow and dependency changes.
  #
  # ci.yml carries no secrets (unlike release.yml), so an approved fork run can
  # build and test but has nothing to exfiltrate.
  push:
  pull_request:
    branches: [main]

# The `if` on each job skips the pull-request event for a PR whose branch lives
# in this same repo: that branch was already built by its push above, so building
# it again for the PR would only double the work on the one runner. A fork PR
# (its head in another repo) has no push event here, so it still runs - once,
# after approval.
jobs:
  fmt:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: self-hosted
    container: rust:1.97.1-bookworm
    steps:
      - name: Checkout
        run: |
          git config --global --add safe.directory '*'
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
      - run: |
          rustup component add rustfmt
          cargo fmt --check

  clippy:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: self-hosted
    container: rust:1.97.1-bookworm
    steps:
      - name: Checkout
        run: |
          git config --global --add safe.directory '*'
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
      - name: mpv headers
        run: |
          apt-get update
          apt-get install -y --no-install-recommends pkg-config libmpv-dev
      - name: Clippy, both feature configurations
        run: |
          rustup component add clippy
          cargo clippy --all-targets -- -D warnings
          cargo clippy -p priel-tui --no-default-features --all-targets -- -D warnings

  test:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: self-hosted
    container: rust:1.97.1-bookworm
    steps:
      - name: Checkout
        run: |
          git config --global --add safe.directory '*'
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
      - name: mpv headers
        run: |
          apt-get update
          apt-get install -y --no-install-recommends pkg-config libmpv-dev
      - name: Tests, both feature configurations
        run: |
          cargo test --locked
          cargo test -p priel-tui --no-default-features --locked
          cargo test -p priel-player --no-default-features --locked
