# Build a release binary and publish it when a version tag is pushed.
#
#   git tag -s v0.1.0 -m 'priel 0.1.0' && git push origin v0.1.0
#
# The tarball is a *prefix tree*: bin/, share/man, share/…/completions and so
# on, laid out exactly as `make install PREFIX=…` would place them. The install
# script unpacks it straight into a prefix with a copy, and the layout is the
# one a distro package uses too.
#
# Needs one secret: RELEASE_TOKEN, a Forgejo application token with
# `write:repository`, under Repo Settings → Actions → Secrets. The automatic job
# token's release permissions vary by Forgejo version, so this uses an explicit
# one. `override: true` makes re-running a tag replace its assets rather than
# fail on the release that already exists.
#
# Rust is installed and used in the same step, sourcing ~/.cargo/env, because
# the runner image ships no Rust and a PATH set in an earlier step did not carry.
name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: codeberg-medium
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4

      - name: Build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential pkg-config libmpv-dev

      - uses: https://data.forgejo.org/actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-

      - name: Build and stage the release tarball
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal
          . "$HOME/.cargo/env"
          cargo build --release --locked -p priel-tui
          make assets
          strip target/release/priel

          tag='${{ github.ref_name }}'
          name="priel-${tag}-x86_64-linux"
          root="dist/${name}"
          mkdir -p \
            "${root}/bin" \
            "${root}/share/man/man1" \
            "${root}/share/bash-completion/completions" \
            "${root}/share/zsh/site-functions" \
            "${root}/share/fish/vendor_completions.d" \
            "${root}/share/licenses/priel" \
            "${root}/share/doc/priel" \
            dist/release
          cp target/release/priel      "${root}/bin/priel"
          cp target/assets/priel.1     "${root}/share/man/man1/priel.1"
          cp target/assets/priel.bash  "${root}/share/bash-completion/completions/priel"
          cp target/assets/_priel      "${root}/share/zsh/site-functions/_priel"
          cp target/assets/priel.fish  "${root}/share/fish/vendor_completions.d/priel.fish"
          cp COPYING                   "${root}/share/licenses/priel/COPYING"
          cp README.md                 "${root}/share/doc/priel/README.md"
          tar -czf "dist/release/${name}.tar.gz" -C dist "${name}"
          ( cd dist/release && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256" )

      - name: Publish release
        uses: https://code.forgejo.org/actions/forgejo-release@v2
        with:
          direction: upload
          url: https://codeberg.org
          repo: ${{ github.repository }}
          tag: ${{ github.ref_name }}
          release-dir: dist/release
          token: ${{ secrets.RELEASE_TOKEN }}
          override: true
