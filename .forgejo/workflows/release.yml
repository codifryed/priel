# Build a release binary and publish it when a version tag is pushed.
#
#   git tag -s v0.1.0 -m 'priel 0.1.0' && git push origin v0.1.0
#
# The tarball is a *prefix tree*: bin/, share/man, share/…/completions and so
# on, laid out exactly as `make install PREFIX=…` would place them. The install
# script unpacks it straight into a prefix with a copy, and the layout is the
# one a distro package uses too.
#
# Runs in the official Rust image (no toolchain install per run); the checkout is
# done by hand with git because the Rust image has no Node for a JavaScript
# action. Needs one secret: RELEASE_TOKEN, a Forgejo application token with
# `write:repository`, under Repo Settings → Actions → Secrets - the automatic job
# token's release permissions vary by version. `override: true` makes re-running
# a tag replace its assets rather than fail on the release that already exists.
name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: self-hosted
    container: rust:1.97.1-bookworm
    # Injected at the job level rather than on the publish step: a container job
    # picks a job-level secret up more reliably, and it keeps the value in one
    # place. The publish step checks it is actually present before using it.
    env:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    steps:
      - name: Checkout
        run: |
          git config --global --add safe.directory '*'
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: mpv headers
        run: |
          apt-get update
          apt-get install -y --no-install-recommends pkg-config libmpv-dev

      - name: Build and stage the release tarball
        run: |
          cargo build --release --locked -p priel-tui
          # Generate the man page and completions from the *release* build rather
          # than `make assets`, which does `cargo run` in debug and so compiles a
          # whole second `target/debug` tree. On Codeberg's free runners the
          # filesystem counts against RAM, and that extra tree tips it over - the
          # release build alone fits. This reuses the release deps and adds no
          # debug tree.
          cargo run --release --locked --features gen-assets --bin priel-gen-assets -- target/assets
          strip target/release/priel

          tag='${{ github.ref_name }}'
          name="priel-${tag}-x86_64-linux"
          root="dist/${name}"
          mkdir -p \
            "${root}/bin" \
            "${root}/share/man/man1" \
            "${root}/share/bash-completion/completions" \
            "${root}/share/zsh/site-functions" \
            "${root}/share/fish/vendor_completions.d" \
            "${root}/share/licenses/priel" \
            "${root}/share/doc/priel" \
            dist/release
          cp target/release/priel      "${root}/bin/priel"
          cp target/assets/priel.1     "${root}/share/man/man1/priel.1"
          cp target/assets/priel.bash  "${root}/share/bash-completion/completions/priel"
          cp target/assets/_priel      "${root}/share/zsh/site-functions/_priel"
          cp target/assets/priel.fish  "${root}/share/fish/vendor_completions.d/priel.fish"
          cp COPYING                   "${root}/share/licenses/priel/COPYING"
          cp README.md                 "${root}/share/doc/priel/README.md"
          tar -czf "dist/release/${name}.tar.gz" -C dist "${name}"
          ( cd dist/release && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256" )

      # Published with the API directly rather than the forgejo-release action,
      # for the same reason the checkout is by hand: that action is JavaScript
      # and this image has no Node. Find or create the release for the tag, clear
      # its old assets so a re-run replaces rather than duplicates, then upload
      # the fresh set.
      - name: Publish release
        run: |
          set -e
          # `-u` is off deliberately: an absent secret should give the clear
          # message below, not an "unbound variable" abort at the first use.
          if [ -z "${RELEASE_TOKEN:-}" ]; then
            echo "error: RELEASE_TOKEN is empty. Add a Forgejo application token"
            echo "with write:repository as the repo secret RELEASE_TOKEN, and make"
            echo "sure the runner is allowed to receive secrets."
            exit 1
          fi
          tag='${{ github.ref_name }}'
          api="https://codeberg.org/api/v1/repos/${GITHUB_REPOSITORY}"
          auth="Authorization: token ${RELEASE_TOKEN}"

          rid="$(curl -fsSL -H "$auth" "$api/releases/tags/$tag" 2>/dev/null \
            | grep -o '"id":[0-9]*' | head -1 | sed 's/.*://')"
          if [ -z "${rid:-}" ]; then
            rid="$(curl -fsS -H "$auth" -H 'Content-Type: application/json' -X POST \
              -d "{\"tag_name\":\"$tag\",\"name\":\"$tag\"}" "$api/releases" \
              | grep -o '"id":[0-9]*' | head -1 | sed 's/.*://')"
          fi
          [ -n "${rid:-}" ] || { echo 'could not find or create the release'; exit 1; }

          for aid in $(curl -fsSL -H "$auth" "$api/releases/$rid/assets" \
              | grep -o '"id":[0-9]*' | sed 's/.*://'); do
            curl -fsS -H "$auth" -X DELETE "$api/releases/$rid/assets/$aid" >/dev/null || true
          done
          for f in dist/release/*; do
            fn="$(basename "$f")"
            curl -fsS -H "$auth" -X POST -F "attachment=@$f" \
              "$api/releases/$rid/assets?name=$fn" >/dev/null
            echo "uploaded $fn"
          done
