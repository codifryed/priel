# Build and publish a release binary for each architecture when a version tag is
# pushed.
#
#   git tag -s v0.3.0 -m 'priel 0.3.0' && git push origin v0.3.0
#
# The tarball is a *prefix tree*: bin/, share/man, share/…/completions and so on,
# laid out exactly as `make install PREFIX=…` would place them. The install script
# unpacks it straight into a prefix with a copy, and the layout is the one a distro
# package uses too.
#
# One tarball per architecture, each built on a *native* runner: x86_64 on
# ubuntu-latest, aarch64 on ubuntu-24.04-arm (free for public repositories). The
# aarch64 binary is compiled and linked against a real aarch64 libmpv rather than
# cross-linked - a cross build would need an aarch64 sysroot with libmpv in it,
# which the native runner makes unnecessary. `uname -m` names the asset, so it is
# exactly the string the install script tests to choose one.
#
# The two architectures build one after another (`max-parallel: 1`), not at once:
# each leg creates-or-updates the one release for the tag, and serialising them
# keeps the two legs from racing to create it. A release is infrequent, so the
# extra wall-clock is cheap next to not having to reason about that race.
#
# Runs inside the official Rust image (no toolchain install per run); the image is
# multi-arch, so the same pinned tag pulls the arm64 variant on the arm runner.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      # `fail-fast: false` lets both architectures attempt even if one fails, so a
      # broken arm build does not mask an x86_64 one; `max-parallel: 1` runs them
      # one at a time so they do not race to create the release.
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    container: rust:1.97.1-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: mpv headers
        run: |
          apt-get update
          apt-get install -y --no-install-recommends pkg-config libmpv-dev

      - name: Build and stage the release tarball
        # The tag name comes in through env rather than `${{ }}` interpolated into
        # the script, so a tag carrying shell metacharacters cannot be executed.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cargo build --release --locked -p priel-tui
          # Generate the man page and completions from the *release* build rather
          # than `make assets`, which does `cargo run` in debug and so compiles a
          # whole second `target/debug` tree - reusing the release deps here adds
          # no debug tree.
          cargo run --release --locked --features gen-assets --bin priel-gen-assets -- target/assets
          strip target/release/priel

          # `uname -m` names the asset, so it is exactly the string the install
          # script tests: x86_64 here, aarch64 on the arm runner.
          arch="$(uname -m)"
          name="priel-${TAG}-${arch}-linux"
          root="dist/${name}"
          mkdir -p \
            "${root}/bin" \
            "${root}/share/man/man1" \
            "${root}/share/bash-completion/completions" \
            "${root}/share/zsh/site-functions" \
            "${root}/share/fish/vendor_completions.d" \
            "${root}/share/licenses/priel" \
            "${root}/share/doc/priel" \
            dist/release
          cp target/release/priel      "${root}/bin/priel"
          cp target/assets/priel.1     "${root}/share/man/man1/priel.1"
          cp target/assets/priel.bash  "${root}/share/bash-completion/completions/priel"
          cp target/assets/_priel      "${root}/share/zsh/site-functions/_priel"
          cp target/assets/priel.fish  "${root}/share/fish/vendor_completions.d/priel.fish"
          cp COPYING                   "${root}/share/licenses/priel/COPYING"
          cp README.md                 "${root}/share/doc/priel/README.md"
          tar -czf "dist/release/${name}.tar.gz" -C dist "${name}"
          ( cd dist/release && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256" )

      # Create or update the release for this tag and upload this architecture's
      # tarball and its checksum. softprops/action-gh-release replaces same-named
      # assets on a re-run, so re-pushing a tag refreshes rather than duplicates,
      # and the second matrix leg adds its asset to the release the first created.
      # The tag and release name default to the ref that triggered the run.
      #
      # Pinned to a full commit SHA, not the `v3` tag: this step runs with
      # `contents: write` and the GITHUB_TOKEN, so a moved or compromised tag on a
      # third-party action could hijack the release. Bump the SHA and the comment
      # together when updating. SHA is v3.0.2.
      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/release/*.tar.gz
            dist/release/*.tar.gz.sha256
          fail_on_unmatched_files: true
