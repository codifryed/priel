[package]
name = "priel-tui"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Unofficial hi-res terminal client for TIDAL (mouse + VIM)"
# The asset generator is a second binary in this crate, which otherwise makes
# `cargo run` ambiguous even though its required-features are off by default.
default-run = "priel"

[[bin]]
name = "priel"
path = "src/main.rs"

# Generates the man page and shell completions from the same clap definition the
# binary uses. Feature-gated so its two dependencies stay out of what ships.
[[bin]]
name = "priel-gen-assets"
path = "src/bin/gen_assets.rs"
required-features = ["gen-assets"]

[features]
default = ["libmpv"]
libmpv = ["priel-player/libmpv"]
gen-assets = ["dep:clap_complete", "dep:clap_mangen"]

[dependencies]
anyhow.workspace = true
priel-core.workspace = true
priel-player = { workspace = true }
clap.workspace = true
log.workspace = true
# Serializing listing metadata for the on-disk cache (see `cache` + the
# revalidate path in `worker`).
serde_json.workspace = true
clap_complete = { workspace = true, optional = true }
clap_mangen = { workspace = true, optional = true }
unicode-width.workspace = true
# The album cover decoder. Here rather than in a library, on purpose: see the
# workspace manifest and `docs/cover-art.md`.
zune-jpeg.workspace = true
zune-core.workspace = true
# Already in the tree via priel-core, which decodes stream manifests with it, so
# naming it here costs no new crate. Two of the three terminal picture protocols
# want their payload base64'd - see `graphics`.
base64.workspace = true
# One crate with no dependencies of its own, and the only encoder here: sixel
# is a palette format, so a cover has to be quantised to at most 256 colours.
# It is what buys foot and xterm, which take no other picture protocol. The two
# other protocols cost nothing - see `graphics`.
icy_sixel = "0.1"
ratatui = "0.29"
crossterm = "0.28"
rand = "0.8"

[dev-dependencies]
base64.workspace = true

[lints]
workspace = true
